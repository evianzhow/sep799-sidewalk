# coordinates of the Husky's bounding box, (0,0) is at the center of the Husky
footprint: [[-0.52, -0.35],[-0.52, 0.35], [0.52, 0.35], [0.52, -0.35]]
footprint_padding: 0.01

inflation_radius: 0

# use transforms that are up to this many seconds old
robot_base_frame: base_link
update_frequency: 4.0
publish_frequency: 3.0
transform_tolerance: 0.5

obstacle_range: 10.0
raytrace_range: 10.0

# layer definitions
# map layer
static_layer:
  map_topic: /map
  subscribe_to_updates: true

# combine rgb-d point cloud and object detection point clouds
obstacles_combined:
  observation_sources: oak_point_cloud object_detection_point_cloud
  
  # ZED observation source
  oak_point_cloud:
    sensor_frame: oak-d-base-frame
    data_type: PointCloud2
    topic: /oak_d/depth/depth/points
    marking: true
    clearing: true
    obstacle_range: 2.5
    raytrace_range: 6.0
    max_obstacle_height: 0.8
    min_obstacle_height: 0.1

  # 3D object detection observation source
  object_detection_point_cloud: 
    sensor_frame: base_footprint
    data_type: PointCloud
    topic: /obstacle_cloud
    marking: true
    clearing: true
    obstacle_range: 10.0
    raytrace_range: 10.0
    max_obstacle_height: 0.8
    min_obstacle_height: 0.1
    observation_persistence: 1.0

# inflation layer
inflation:
  inflation_radius: 0.0